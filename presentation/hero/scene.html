<!doctype html>
<!-- Original conceptual 3D scenes for the SIH deck (not prototype screenshots).
     Low-poly Indian road scenes with mixed traffic, predicted motion, candidate paths and a safe corridor.
     Rendered to PNG by render_hero.mjs.
     Query: scene=road|market|village  view=chase|iso|top  boxes=1 (perception boxes)  fan=1 (candidate paths)
            corridor=0 (hide corridor)  w,h (pixels) -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const q = new URLSearchParams(location.search);
const SCENE = q.get("scene") || "road";
const VIEW = q.get("view") || "chase";
const NAIVE = q.get("naive") === "1", BOXES = q.get("boxes") === "1", FAN = q.get("fan") === "1", CORRIDOR = q.get("corridor") !== "0";
const W = +q.get("w") || 1920, H = +q.get("h") || 1080;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
// three.js looks down +z with +x on screen-LEFT; mirror the image so the scene's x axis reads left->right
// (the ego vehicle keeps to the LEFT, as in Indian left-hand traffic).
renderer.domElement.style.transform = "scaleX(-1)";

const BG = 0xffffff;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
const far = VIEW === "chase" ? [40, 88] : VIEW === "top" ? [90, 160] : [62, 115];
scene.fog = new THREE.Fog(BG, far[0], far[1]);

scene.add(new THREE.HemisphereLight(0xffffff, 0xc9ced6, 1.55));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-18, 34, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 60, bottom: -30, near: 1, far: 130 });
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
sun.target.position.set(0, 0, 18);
scene.add(sun, sun.target);

// ---------------------------------------------------------------- materials (muted, with Indian-road colour cues)
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0.05, ...o });
const body = M(0xdfe3e8), bodyDark = M(0xc7ccd3), glass = M(0x5b6472, { roughness: 0.25, metalness: 0.2 });
const tyre = M(0x3a3f47, { roughness: 0.9 }), skin = M(0xcfd4db);
const TEAL = 0x0f9e8e, AMBER = 0xe08a00, RED = 0xdc2626, BLUE = 0x2f6fb3;
const carMats = [M(0xf4f5f7), M(0xb9c3cf), M(0x7d8a9c), M(0xc9d8ea), M(0xe6e1d6)];
const autoBody = M(0x8cbf5a), autoTop = M(0xf0c93e);          // green body, yellow canopy
const busMat = M(0xc85a4f), truckCab = M(0xe39a45), truckBox = M(0xd9dde3);
const clothes = [M(0x5b7fb8), M(0xc8665c), M(0xe0b04a), M(0x6aa37a), M(0x9a7bb8), M(0xd8dde4)];
const cowMat = M(0xefe9e0);
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pick = (a) => a[Math.floor(rnd() * a.length)];

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
const rbox = (w, h, d, r = 0.12) => new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2 - 0.01, h / 2 - 0.01, d / 2 - 0.01));
function wheel(g, x, z, r = 0.34, w = 0.24) {
  const m = mesh(new THREE.CylinderGeometry(r, r, w, 24), tyre, x, r, z, g);
  m.rotation.z = Math.PI / 2;
}
const agents = [];
function place(g, x, z, yaw = 0, kind = null) {
  g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g);
  if (kind) agents.push({ g, kind });
  return g;
}

// ---------------------------------------------------------------- road users
function car(mat = pick(carMats), len = 4.3) {
  const g = new THREE.Group();
  mesh(rbox(1.8, 0.62, len, 0.22), mat, 0, 0.6, 0, g);
  mesh(rbox(1.56, 0.5, len * 0.5, 0.2), mat, 0, 1.12, -0.1, g);
  mesh(rbox(1.6, 0.36, len * 0.46, 0.14), glass, 0, 1.1, -0.1, g);
  for (const sx of [-0.82, 0.82]) for (const sz of [-1.35, 1.35]) wheel(g, sx, sz * len / 4.3);
  return g;
}
function truck() {
  const g = new THREE.Group();
  mesh(rbox(2.4, 2.1, 1.9, 0.18), truckCab, 0, 1.55, 3.0, g);
  mesh(rbox(2.3, 0.7, 1.7, 0.1), glass, 0, 2.0, 3.35, g);
  mesh(rbox(2.5, 2.9, 6.0, 0.08), truckBox, 0, 2.0, -1.1, g);
  for (const sx of [-1.05, 1.05]) for (const sz of [3.0, -0.6, -2.8]) wheel(g, sx, sz, 0.5, 0.36);
  return g;
}
function bus() {
  const g = new THREE.Group();
  mesh(rbox(2.5, 2.9, 10.5, 0.3), busMat, 0, 1.9, 0, g);
  mesh(rbox(2.54, 0.8, 9.6, 0.1), glass, 0, 2.35, 0.1, g);
  for (const sx of [-1.1, 1.1]) for (const sz of [3.6, -3.4]) wheel(g, sx, sz, 0.52, 0.36);
  return g;
}
function auto() {                                                      // auto-rickshaw: 3 wheels, canopy
  const g = new THREE.Group();
  mesh(rbox(1.3, 0.55, 2.6, 0.2), autoBody, 0, 0.62, 0, g);
  mesh(rbox(1.36, 0.16, 2.2, 0.06), autoTop, 0, 1.82, -0.15, g);
  mesh(rbox(1.2, 0.95, 0.1, 0.04), glass, 0, 1.3, 0.75, g);
  for (const sx of [-0.62, 0.62]) mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 8), bodyDark, sx, 1.25, -1.1, g);
  wheel(g, 0, 1.05, 0.26, 0.14);
  wheel(g, -0.6, -0.8, 0.28, 0.16); wheel(g, 0.6, -0.8, 0.28, 0.16);
  return g;
}
function person(mat = pick(clothes), h = 1.7) {
  const g = new THREE.Group();
  mesh(new THREE.CapsuleGeometry(0.2, h - 0.75, 6, 12), mat, 0, (h - 0.3) / 2 + 0.05, 0, g);
  mesh(new THREE.SphereGeometry(0.15, 16, 12), skin, 0, h - 0.12, 0, g);
  return g;
}
function bike(mat = pick([bodyDark, M(0x4f6d9a), M(0xb44a42)])) {    // two-wheeler + rider
  const g = new THREE.Group();
  mesh(rbox(0.36, 0.5, 1.8, 0.1), mat, 0, 0.62, 0, g);
  wheel(g, 0, 0.72, 0.3, 0.1); wheel(g, 0, -0.72, 0.3, 0.1);
  mesh(new THREE.CapsuleGeometry(0.2, 0.5, 6, 12), pick(clothes), 0, 1.28, -0.1, g);
  mesh(new THREE.SphereGeometry(0.17, 16, 12), skin, 0, 1.78, -0.05, g);
  return g;
}
function cycle() {
  const g = new THREE.Group();
  wheel(g, 0, 0.55, 0.33, 0.05); wheel(g, 0, -0.55, 0.33, 0.05);
  mesh(rbox(0.08, 0.08, 1.1, 0.03), bodyDark, 0, 0.6, 0, g);
  mesh(new THREE.CapsuleGeometry(0.18, 0.5, 6, 12), pick(clothes), 0, 1.25, -0.15, g);
  mesh(new THREE.SphereGeometry(0.15, 16, 12), skin, 0, 1.75, -0.1, g);
  return g;
}
function cow() {
  const g = new THREE.Group();
  mesh(rbox(0.7, 0.75, 1.7, 0.25), cowMat, 0, 1.05, 0, g);
  mesh(rbox(0.4, 0.4, 0.55, 0.14), cowMat, 0, 1.3, 1.02, g);
  for (const sx of [-0.2, 0.2]) {
    for (const sz of [-0.6, 0.6]) mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.7, 8), cowMat, sx, 0.35, sz, g);
    const horn = mesh(new THREE.ConeGeometry(0.04, 0.22, 8), bodyDark, sx * 0.8, 1.6, 0.98, g);
    horn.rotation.z = -sx * 2.2;
  }
  return g;
}
function cart() {                                                      // hand cart / vendor cart
  const g = new THREE.Group();
  mesh(rbox(1.2, 0.18, 2.0, 0.05), M(0xb08a5a), 0, 0.85, 0, g);
  mesh(rbox(1.0, 0.35, 1.7, 0.08), M(0xe9b44c), 0, 1.1, 0, g);
  wheel(g, -0.62, 0, 0.42, 0.08); wheel(g, 0.62, 0, 0.42, 0.08);
  return g;
}
function tractor() {
  const g = new THREE.Group();
  mesh(rbox(1.3, 1.0, 2.2, 0.15), M(0x4f8f55), 0, 1.1, 0.6, g);
  mesh(rbox(1.2, 1.1, 1.0, 0.1), glass, 0, 2.0, -0.2, g);
  wheel(g, -0.85, -0.6, 0.75, 0.4); wheel(g, 0.85, -0.6, 0.75, 0.4);
  wheel(g, -0.6, 1.3, 0.4, 0.25); wheel(g, 0.6, 1.3, 0.4, 0.25);
  mesh(rbox(2.0, 0.9, 3.0, 0.1), M(0xb89b6a), 0, 1.0, -3.4, g);   // trailer
  wheel(g, -1.0, -3.6, 0.5, 0.3); wheel(g, 1.0, -3.6, 0.5, 0.3);
  return g;
}
function barrier() {                                                   // temporary obstacle: work zone
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) mesh(new THREE.ConeGeometry(0.22, 0.75, 16), M(0xf08a3c), i * 0.75 - 1.1, 0.38, i * 0.3, g);
  mesh(rbox(1.8, 0.9, 1.2, 0.1), M(0xb9a88f), 0.2, 0.45, -1.4, g);
  return g;
}
function stall(x, z, yaw, color) {
  const g = new THREE.Group();
  mesh(rbox(2.6, 0.9, 1.6, 0.06), M(0xcfb58a), 0, 0.45, 0, g);
  for (let i = 0; i < 5; i++) mesh(new THREE.SphereGeometry(0.16, 10, 8), M(pick([0xe0574f, 0xf0b43c, 0x6bb35a, 0xf08a3c])), -0.9 + i * 0.45, 1.0, 0.1, g);
  const a = mesh(new THREE.BoxGeometry(3.0, 0.06, 2.0), M(color), 0, 2.3, 0.2, g);
  a.rotation.x = 0.25;
  for (const sx of [-1.35, 1.35]) mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.3, 6), bodyDark, sx, 1.15, 0.9, g);
  g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g);
}
function hut(x, z, yaw = 0) {
  const g = new THREE.Group();
  mesh(rbox(3.2, 2.0, 3.0, 0.08), M(0xe8dcc6), 0, 1.0, 0, g);
  const roof = mesh(new THREE.ConeGeometry(2.7, 1.5, 4), M(0xb4744a), 0, 2.75, 0, g);
  roof.rotation.y = Math.PI / 4;
  g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g);
}
function building(x, z, w, h, d, color = 0xeceef1) { mesh(rbox(w, h, d, 0.1), M(color), x, h / 2, z); }
function tree(x, z, s = 1) {
  mesh(new THREE.CylinderGeometry(0.09 * s, 0.12 * s, 1.8 * s, 8), M(0x9c8a74), x, 0.9 * s, z);
  mesh(new THREE.IcosahedronGeometry(1.0 * s, 1), M(0xb7d0a8, { flatShading: true }), x, 2.4 * s, z);
}

// ---------------------------------------------------------------- ground helpers
const ground = mesh(new THREE.PlaneGeometry(500, 500), M(0xeef0f3, { roughness: 1 }), 0, 0, 0);
ground.rotation.x = -Math.PI / 2;
ground.castShadow = false;
function strip(pts, color, y) {                                        // pts: [[xl, xr, z], ...] -> flat polygon
  const shape = new THREE.Shape();
  pts.forEach(([xl, , z], i) => (i ? shape.lineTo(xl, -z) : shape.moveTo(xl, -z)));
  [...pts].reverse().forEach(([, xr, z]) => shape.lineTo(xr, -z));
  const m = mesh(new THREE.ShapeGeometry(shape, 1), M(color, { roughness: 1 }), 0, y, 0);
  m.rotation.x = -Math.PI / 2;
  m.castShadow = false;
  return m;
}
function rect(x0, x1, z0, z1, color, y = 0.012) { return strip([[x0, x1, z0], [x0, x1, z1]], color, y); }
function ribbon(curve, width, color, opacity, y = 0.04, fadeEnd = true) {
  const n = 120, pos = [], alpha = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = curve.getPoint(t), tan = curve.getTangent(t);
    const nx = -tan.z, nz = tan.x, l = Math.hypot(nx, nz) || 1;
    for (const s of [-1, 1]) { pos.push(p.x + (s * width / 2) * nx / l, y, p.z + (s * width / 2) * nz / l); alpha.push(fadeEnd ? Math.pow(1 - t, 1.2) : 1); }
    if (i < n) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("a", new THREE.Float32BufferAttribute(alpha, 1));
  g.setIndex(idx);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { c: { value: new THREE.Color(color) }, o: { value: opacity } },
    vertexShader: "attribute float a; varying float va; void main(){ va=a; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
    fragmentShader: "uniform vec3 c; uniform float o; varying float va; void main(){ gl_FragColor=vec4(c, o*va); }",
  });
  const m = new THREE.Mesh(g, mat);
  scene.add(m);
  return m;
}
function predicted(from, to, color, width = 0.14) {                    // dashed arrow on the ground
  const dir = new THREE.Vector3().subVectors(to, from), len = dir.length(), n = Math.max(2, Math.floor(len / 0.9));
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false });
  const ang = Math.atan2(dir.x, dir.z);
  for (let i = 0; i < n; i++) {
    const p = from.clone().addScaledVector(dir, (i + 0.2) / n);
    const d = mesh(new THREE.PlaneGeometry(width, 0.5), mat, p.x, 0.06, p.z);
    d.rotation.set(-Math.PI / 2, 0, ang); d.castShadow = false;
  }
  const head = new THREE.Shape([new THREE.Vector2(-0.34, 0), new THREE.Vector2(0.34, 0), new THREE.Vector2(0, -0.6)]);
  const h = mesh(new THREE.ShapeGeometry(head), mat, to.x, 0.06, to.z);
  h.rotation.set(-Math.PI / 2, 0, ang); h.castShadow = false;
}
function ring(x, z, r, color, opacity = 0.9) {
  const m = mesh(new THREE.RingGeometry(r - 0.09, r, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }), x, 0.055, z);
  m.rotation.x = -Math.PI / 2; m.castShadow = false;
  const f = mesh(new THREE.CircleGeometry(r - 0.09, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12, depthWrite: false }), x, 0.05, z);
  f.rotation.x = -Math.PI / 2; f.castShadow = false;
}
const V = (x, z) => new THREE.Vector3(x, 0, z);
function ego(x, z, yaw = 0) {
  place(car(M(0xffffff, { roughness: 0.35, metalness: 0.15 }), 4.5), x, z, yaw);
  const glow = mesh(new THREE.PlaneGeometry(3.0, 6.2), new THREE.MeshBasicMaterial({ color: TEAL, transparent: true, opacity: 0.18, depthWrite: false }), x, 0.03, z);
  glow.rotation.set(-Math.PI / 2, 0, yaw); glow.castShadow = false;
}
// candidate-path fan from (x0, z0): each arc is a kinematic curve x = x0 + k z^2; arcs that pass through an obstacle
// disc are drawn red (rejected), the rest grey, the chosen one teal.
function fan(x0, z0, len, obstacles, chosenK) {
  const ks = [];
  for (let i = -8; i <= 8; i++) ks.push(i * 0.0065);
  for (const k of ks) {
    const pts = [];
    for (let s = 0; s <= 10; s++) { const d = (len * s) / 10; pts.push(V(x0 + k * d * d, z0 + d)); }
    const hit = pts.some((p) => obstacles.some(([ox, oz, r]) => Math.hypot(p.x - ox, p.z - oz) < r));
    ribbon(new THREE.CatmullRomCurve3(pts), hit ? 0.1 : 0.09, hit ? RED : 0x8d97a5, hit ? 0.45 : 0.6, 0.036);
  }
  const pts = [];
  for (let s = 0; s <= 10; s++) { const d = (len * s) / 10; pts.push(V(x0 + chosenK(d), z0 + d)); }
  const c = new THREE.CatmullRomCurve3(pts);
  ribbon(c, 2.2, TEAL, 0.3); ribbon(c, 0.16, TEAL, 0.95, 0.05);
}

// ================================================================ SCENES
let camSet;
if (SCENE === "road") {
  // irregular carriageway, no lane markings, left-hand traffic
  const road = [];
  for (let z = -20; z <= 160; z += 4) {
    const w = Math.sin(z * 0.21) * 0.35 + Math.sin(z * 0.07) * 0.5;
    road.push([-5.4 + w + (z > 30 && z < 44 ? 0.9 : 0), 5.6 - w * 0.7 + (z > 50 && z < 70 ? -0.8 : 0), z]);
  }
  strip(road, 0xdfe3e8, 0.01);
  strip(road.map(([xl, , z]) => [xl - 2.6 - Math.sin(z * 0.3) * 0.4, xl, z]), 0xe9e2d6, 0.008);
  strip(road.map(([, xr, z]) => [xr, xr + 2.4 + Math.cos(z * 0.27) * 0.4, z]), 0xe9e2d6, 0.008);
  for (const [x, z, r] of [[1.6, 26, 0.6], [-2.8, 48, 0.45], [2.8, 62, 0.7], [-1.2, 80, 0.5]]) {
    const p = mesh(new THREE.CircleGeometry(r, 20), M(0xcfd4db, { roughness: 1 }), x, 0.015, z);
    p.rotation.x = -Math.PI / 2; p.scale.set(1.4, 1, 1); p.castShadow = false;
  }
  const EX = -2.4;
  ego(EX, 0);
  const path = new THREE.CatmullRomCurve3([V(EX, 2.4), V(EX, 10), V(EX + 0.6, 18), V(EX + 1.7, 25), V(EX + 1.5, 32), V(EX + 0.4, 40)]);
  if (NAIVE) {                       // "before": a lane-following path that ignores the work zone and the crossing pedestrian
    const straight = new THREE.CatmullRomCurve3([V(EX, 2.4), V(EX, 12), V(EX, 23.5)]);
    ribbon(straight, 2.3, 0x8d97a5, 0.35, 0.04, false); ribbon(straight, 0.16, 0x6b7280, 0.9, 0.05, false);
    ring(EX - 0.1, 25.4, 2.4, RED, 0.95);
    for (const r of [0.8, -0.8]) { const x = mesh(new THREE.PlaneGeometry(0.28, 3.4), new THREE.MeshBasicMaterial({ color: RED }), EX - 0.1, 0.07, 25.4); x.rotation.set(-Math.PI / 2, 0, r); x.castShadow = false; }
  } else if (FAN) fan(EX, 2.4, 30, [[EX - 0.2, 25.4, 1.9], [1.2, 36, 0.9], [1.4, 14, 1.1], [3.4, 30, 1.6]], (d) => d < 22 ? 0.0034 * d * d : 1.65 - 0.02 * (d - 22) * (d - 22));
  else if (CORRIDOR) {
    ribbon(path, 2.3, TEAL, 0.34); ribbon(path, 0.16, TEAL, 0.95, 0.05);
    for (const k of [-1, -0.5, 0.5, 1]) ribbon(new THREE.CatmullRomCurve3([0, 8, 16, 24].map((z, i) => V(EX + k * i * i * 0.35, 2.4 + z))), 0.07, 0x9aa3ae, 0.55, 0.035);
  }
  place(barrier(), EX - 0.2, 26, 0.2, "obstacle");
  ring(EX - 0.1, 25.4, 2.0, 0x8b95a3, 0.7);
  place(person(M(0xd9534f)), 1.2, 36, -Math.PI / 2, "person");
  ring(1.2, 36, 0.8, RED);
  predicted(V(1.0, 36), V(-2.2, 36), RED);
  place(bike(M(0xe0a03a)), 1.4, 14, -0.35, "bike");
  ring(1.4, 14, 1.2, AMBER);
  predicted(V(1.0, 15.2), V(-0.6, 19.5), AMBER);
  place(auto(), -3.2, 46, 0.05, "auto"); place(car(), 0.2, 54, 0.1, "car"); place(bike(), -3.8, 58, 0, "bike");
  place(bus(), -2.4, 72, 0, "bus"); place(auto(), -0.6, 40, -0.12, "auto"); place(bike(), 0.9, 47, 0.05, "bike");
  place(bike(), -1.6, 60, -0.1, "bike"); place(auto(), 1.4, 66, 0.0, "auto");
  place(truck(), 3.4, 30, Math.PI, "truck"); place(car(), 3.2, 50, Math.PI + 0.04, "car");
  place(auto(), 3.6, 64, Math.PI, "auto"); place(bike(), 2.2, 8, Math.PI + 0.1, "bike");
  place(bike(M(0xe0a03a)), -4.3, 40, Math.PI, "bike");
  ring(-4.3, 40, 1.1, AMBER);
  predicted(V(-4.3, 38.8), V(-4.3, 33.8), AMBER);
  place(person(), -7.6, 16, 0.1, "person"); place(person(), -7.2, 17.2, 0.2, "person"); place(person(undefined, 1.55), -8.0, 20, 1.2, "person");
  place(person(), -7.4, 52, 0, "person"); place(person(), 7.9, 22, Math.PI, "person"); place(person(), 8.2, 44, 2.5, "person");
  place(cow(), 7.4, 36, -0.4, "animal"); place(cow(), 8.6, 38.5, 0.3, "animal");
  for (let z = 6; z < 150; z += 7 + (z % 3)) for (const side of [-1, 1]) {
    const hgt = 1.6 + ((z * 7) % 3) * 0.7;
