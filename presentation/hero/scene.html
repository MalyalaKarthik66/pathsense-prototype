<!doctype html>
<!-- Original conceptual 3D scene for the SIH deck (not a prototype screenshot).
     An ego vehicle on an unstructured, left-hand-traffic Indian road with mixed traffic, a safe corridor and
     predicted paths. Rendered to PNG by render_hero.mjs; ?view=hero | iso selects the camera. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const q = new URLSearchParams(location.search);
const VIEW = q.get("view") || "hero";
const W = +q.get("w") || 1920, H = +q.get("h") || 1080;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
// three.js looks down +z with +x on screen-LEFT; mirror the image so the scene's x axis reads left->right
// (the ego vehicle keeps to the LEFT, as in Indian left-hand traffic).
renderer.domElement.style.transform = "scaleX(-1)";

const BG = 0xffffff;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, VIEW === "iso" ? 62 : 40, VIEW === "iso" ? 115 : 88);

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9ced6, 1.55));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-18, 34, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 60, bottom: -30, near: 1, far: 120 });
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
sun.target.position.set(0, 0, 18);
scene.add(sun, sun.target);

// ---------------------------------------------------------------- materials
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0.05, ...o });
const body = M(0xdfe3e8), bodyDark = M(0xc7ccd3), glass = M(0x5b6472, { roughness: 0.25, metalness: 0.2 });
const tyre = M(0x3a3f47, { roughness: 0.9 }), skin = M(0xcfd4db);
const TEAL = 0x0f9e8e, AMBER = 0xe08a00, RED = 0xdc2626;

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
const rbox = (w, h, d, r = 0.12) => new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2 - 0.01, h / 2 - 0.01, d / 2 - 0.01));
function wheel(g, x, z, r = 0.34, w = 0.24) {
  const m = mesh(new THREE.CylinderGeometry(r, r, w, 24), tyre, x, r, z, g);
  m.rotation.z = Math.PI / 2;
}
function place(g, x, z, yaw = 0) { g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return g; }

// ---------------------------------------------------------------- road users (all low-poly, monochrome)
function car(mat = body, len = 4.3) {
  const g = new THREE.Group();
  mesh(rbox(1.8, 0.62, len, 0.22), mat, 0, 0.6, 0, g);
  mesh(rbox(1.56, 0.5, len * 0.5, 0.2), mat, 0, 1.12, -0.1, g);
  mesh(rbox(1.6, 0.36, len * 0.46, 0.14), glass, 0, 1.1, -0.1, g);
  for (const sx of [-0.82, 0.82]) for (const sz of [-1.35, 1.35]) wheel(g, sx, sz * len / 4.3);
  return g;
}
function suv() { const g = car(bodyDark, 4.6); g.scale.set(1.05, 1.12, 1); return g; }
function truck() {
  const g = new THREE.Group();
  mesh(rbox(2.4, 2.1, 1.9, 0.18), body, 0, 1.55, 3.0, g);             // cab
  mesh(rbox(2.3, 0.7, 1.7, 0.1), glass, 0, 2.0, 3.35, g);
  mesh(rbox(2.5, 2.9, 6.0, 0.08), bodyDark, 0, 2.0, -1.1, g);           // cargo
  for (const sx of [-1.05, 1.05]) for (const sz of [3.0, -0.6, -2.8]) wheel(g, sx, sz, 0.5, 0.36);
  return g;
}
function bus() {
  const g = new THREE.Group();
  mesh(rbox(2.5, 2.9, 10.5, 0.3), body, 0, 1.9, 0, g);
  mesh(rbox(2.54, 0.8, 9.6, 0.1), glass, 0, 2.35, 0.1, g);
  for (const sx of [-1.1, 1.1]) for (const sz of [3.6, -3.4]) wheel(g, sx, sz, 0.52, 0.36);
  return g;
}
function auto() {                                                      // auto-rickshaw: 3 wheels, canopy
  const g = new THREE.Group();
  mesh(rbox(1.3, 0.55, 2.6, 0.2), body, 0, 0.62, 0, g);
  mesh(rbox(1.36, 0.14, 2.2, 0.06), bodyDark, 0, 1.82, -0.15, g);      // canopy roof
  mesh(rbox(1.2, 0.95, 0.1, 0.04), glass, 0, 1.3, 0.75, g);             // windscreen
  for (const sx of [-0.62, 0.62]) mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 8), bodyDark, sx, 1.25, -1.1, g);
  wheel(g, 0, 1.05, 0.26, 0.14);
  wheel(g, -0.6, -0.8, 0.28, 0.16); wheel(g, 0.6, -0.8, 0.28, 0.16);
  return g;
}
function person(mat = skin, h = 1.7) {
  const g = new THREE.Group();
  mesh(new THREE.CapsuleGeometry(0.2, h - 0.75, 6, 12), mat, 0, (h - 0.3) / 2 + 0.05, 0, g);
  mesh(new THREE.SphereGeometry(0.15, 16, 12), mat, 0, h - 0.12, 0, g);
  return g;
}
function bike(mat = bodyDark) {                                        // two-wheeler + rider
  const g = new THREE.Group();
  mesh(rbox(0.36, 0.5, 1.8, 0.1), mat, 0, 0.62, 0, g);
  wheel(g, 0, 0.72, 0.3, 0.1); wheel(g, 0, -0.72, 0.3, 0.1);
  mesh(new THREE.CapsuleGeometry(0.2, 0.5, 6, 12), skin, 0, 1.28, -0.1, g);
  mesh(new THREE.SphereGeometry(0.17, 16, 12), skin, 0, 1.78, -0.05, g);
  return g;
}
function cow() {
  const g = new THREE.Group();
  mesh(rbox(0.7, 0.75, 1.7, 0.25), skin, 0, 1.05, 0, g);
  mesh(rbox(0.4, 0.4, 0.55, 0.14), skin, 0, 1.3, 1.02, g);
  for (const sx of [-0.2, 0.2]) {
    for (const sz of [-0.6, 0.6]) mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.7, 8), skin, sx, 0.35, sz, g);
    const horn = mesh(new THREE.ConeGeometry(0.04, 0.22, 8), bodyDark, sx * 0.8, 1.6, 0.98, g);
    horn.rotation.z = -sx * 2.2;
  }
  return g;
}
function barrier() {                                                   // temporary obstacle: work zone
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) mesh(new THREE.ConeGeometry(0.22, 0.75, 16), M(0xe3e6ea), i * 0.75 - 1.1, 0.38, i * 0.3, g);
  mesh(rbox(1.8, 0.9, 1.2, 0.1), bodyDark, 0.2, 0.45, -1.4, g);          // heap / stack of material
  return g;
}

// ---------------------------------------------------------------- ground: unstructured road, no lane markings
const ground = mesh(new THREE.PlaneGeometry(400, 400), M(0xeef0f3, { roughness: 1 }), 0, 0, 0);
ground.rotation.x = -Math.PI / 2;
ground.castShadow = false;
function strip(pts, color, y) {                                         // pts: [[xl, xr, z], ...] -> flat polygon
  const shape = new THREE.Shape();
  pts.forEach(([xl, , z], i) => (i ? shape.lineTo(xl, -z) : shape.moveTo(xl, -z)));
  [...pts].reverse().forEach(([, xr, z]) => shape.lineTo(xr, -z));
  const m = mesh(new THREE.ShapeGeometry(shape, 1), M(color, { roughness: 1 }), 0, y, 0);
  m.rotation.x = -Math.PI / 2;
  m.castShadow = false;
  return m;
}
// irregular carriageway edges (wobbly, widening) - x: left(-) ... right(+), z: forward
const road = [];
for (let z = -20; z <= 160; z += 4) {
  const w = Math.sin(z * 0.21) * 0.35 + Math.sin(z * 0.07) * 0.5;
  road.push([-5.4 + w + (z > 30 && z < 44 ? 0.9 : 0), 5.6 - w * 0.7 + (z > 50 && z < 70 ? -0.8 : 0), z]);
}
strip(road, 0xdfe3e8, 0.01);
// dusty shoulders
strip(road.map(([xl, , z]) => [xl - 2.6 - Math.sin(z * 0.3) * 0.4, xl, z]), 0xe7e3dc, 0.008);
strip(road.map(([, xr, z]) => [xr, xr + 2.4 + Math.cos(z * 0.27) * 0.4, z]), 0xe7e3dc, 0.008);
// potholes / patches
for (const [x, z, r] of [[1.6, 26, 0.6], [-2.8, 48, 0.45], [2.8, 62, 0.7], [-1.2, 80, 0.5]]) {
  const p = mesh(new THREE.CircleGeometry(r, 20), M(0xcfd4db, { roughness: 1 }), x, 0.015, z);
  p.rotation.x = -Math.PI / 2; p.scale.set(1.4, 1, 1); p.castShadow = false;
}

// ---------------------------------------------------------------- scene layout (left-hand traffic: ego keeps left)
const EGO_X = -2.4;
// ego vehicle - highlighted
const egoMat = M(0xffffff, { roughness: 0.35, metalness: 0.15 });
const ego = place(car(egoMat, 4.5), EGO_X, 0, 0);
const glow = mesh(new THREE.PlaneGeometry(3.0, 6.2), new THREE.MeshBasicMaterial({ color: TEAL, transparent: true, opacity: 0.16, depthWrite: false }), EGO_X, 0.03, 0);
glow.rotation.x = -Math.PI / 2; glow.castShadow = false;

// safe corridor: a curving ribbon that bends right around the parked work zone, then back left
const path = new THREE.CatmullRomCurve3([
  new THREE.Vector3(EGO_X, 0, 2.4), new THREE.Vector3(EGO_X, 0, 10), new THREE.Vector3(EGO_X + 0.6, 0, 18),
  new THREE.Vector3(EGO_X + 1.7, 0, 25), new THREE.Vector3(EGO_X + 1.5, 0, 32), new THREE.Vector3(EGO_X + 0.4, 0, 40),
]);
function ribbon(curve, width, color, opacity, y = 0.04, fadeEnd = true) {
  const n = 120, pos = [], alpha = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = curve.getPoint(t), tan = curve.getTangent(t);
    const nx = -tan.z, nz = tan.x, l = Math.hypot(nx, nz) || 1;
    for (const s of [-1, 1]) { pos.push(p.x + (s * width / 2) * nx / l, y, p.z + (s * width / 2) * nz / l); alpha.push(fadeEnd ? Math.pow(1 - t, 1.2) : 1); }
    if (i < n) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("a", new THREE.Float32BufferAttribute(alpha, 1));
  g.setIndex(idx);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { c: { value: new THREE.Color(color) }, o: { value: opacity } },
    vertexShader: "attribute float a; varying float va; void main(){ va=a; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
    fragmentShader: "uniform vec3 c; uniform float o; varying float va; void main(){ gl_FragColor=vec4(c, o*va); }",
  });
  const m = new THREE.Mesh(g, mat);
  scene.add(m);
  return m;
}
ribbon(path, 2.3, TEAL, 0.34);                                        // corridor
ribbon(path, 0.16, TEAL, 0.95, 0.05);                                  // centre line of the planned trajectory
// alternative candidate trajectories (faint fan)
for (const k of [-1, -0.5, 0.5, 1]) {
  const c = new THREE.CatmullRomCurve3([0, 8, 16, 24].map((z, i) => new THREE.Vector3(EGO_X + k * i * i * 0.35, 0, 2.4 + z)));
  ribbon(c, 0.07, 0x9aa3ae, 0.55, 0.035);
}

// predicted motion: dashed arrows on the ground
function predicted(from, to, color, width = 0.14) {
  const dir = new THREE.Vector3().subVectors(to, from), len = dir.length(), n = Math.floor(len / 0.9);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false });
  for (let i = 0; i < n; i++) {
    const t = (i + 0.2) / n, p = from.clone().addScaledVector(dir, t);
    const d = mesh(new THREE.PlaneGeometry(width, 0.5), mat, p.x, 0.06, p.z);
    d.rotation.x = -Math.PI / 2; d.rotation.z = -Math.atan2(dir.x, dir.z) + Math.PI; d.castShadow = false;
  }
  const head = new THREE.Shape([new THREE.Vector2(-0.34, 0), new THREE.Vector2(0.34, 0), new THREE.Vector2(0, 0.6)]);
  const h = mesh(new THREE.ShapeGeometry(head), mat, to.x, 0.06, to.z);
  h.rotation.x = -Math.PI / 2; h.rotation.z = -Math.atan2(dir.x, dir.z) + Math.PI; h.castShadow = false;
  // ShapeGeometry is built in xy; after rotation.x=-90deg, +y points to -z, so flip to point along dir
  h.rotation.z += Math.PI;
}
function ring(x, z, r, color, opacity = 0.9) {
  const m = mesh(new THREE.RingGeometry(r - 0.09, r, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }), x, 0.055, z);
  m.rotation.x = -Math.PI / 2; m.castShadow = false;
  const f = mesh(new THREE.CircleGeometry(r - 0.09, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12, depthWrite: false }), x, 0.05, z);
  f.rotation.x = -Math.PI / 2; f.castShadow = false;
}

// temporary obstacle ahead on the left: the reason the corridor bends
place(barrier(), EGO_X - 0.2, 26, 0.2);
ring(EGO_X - 0.1, 25.4, 2.0, 0x8b95a3, 0.7);
// pedestrian crossing ahead (conflict -> red)
const pedMat = M(0xf1c9c9);
place(person(pedMat), 1.2, 36, -Math.PI / 2);
ring(1.2, 36, 0.8, RED);
predicted(new THREE.Vector3(1.0, 0, 36), new THREE.Vector3(-2.2, 0, 36), RED);
// two-wheeler cutting in from the right (amber)
const bikeMat = M(0xf3dcb4);
place(bike(bikeMat), 1.4, 14, -0.35);
ring(1.4, 14, 1.2, AMBER);
predicted(new THREE.Vector3(1.0, 0, 15.2), new THREE.Vector3(-0.6, 0, 19.5), AMBER);
// auto-rickshaws and cars ahead in our flow
place(auto(), -3.2, 46, 0.05);
place(car(), 0.2, 54, 0.1);
place(bike(), -3.8, 58, 0);
place(bus(), -2.4, 72, 0);
place(auto(), -0.6, 40, -0.12);
place(bike(), 0.9, 47, 0.05);
place(bike(), -1.6, 60, -0.1);
place(auto(), 1.4, 66, 0.0);
// oncoming traffic on its own (right) side
place(truck(), 3.4, 30, Math.PI);
place(car(bodyDark), 3.2, 50, Math.PI + 0.04);
place(auto(), 3.6, 64, Math.PI);
place(bike(), 2.2, 8, Math.PI + 0.1);
ring(3.4, 30, 0.0, 0x000000, 0);
// wrong-way two-wheeler on our side, far ahead (amber, predicted path)
place(bike(bikeMat), -4.3, 40, Math.PI);
ring(-4.3, 40, 1.1, AMBER);
predicted(new THREE.Vector3(-4.3, 0, 38.8), new THREE.Vector3(-4.3, 0, 33.8), AMBER);
// people on the left footpath/shoulder (not in the path)
place(person(), -7.6, 16, 0.1); place(person(), -7.2, 17.2, 0.2); place(person(skin, 1.55), -8.0, 20, 1.2);
place(person(), -7.4, 52, 0); place(person(), 7.9, 22, Math.PI); place(person(), 8.2, 44, 2.5);
// cattle on the right shoulder
place(cow(), 7.4, 36, -0.4); place(cow(), 8.6, 38.5, 0.3);
// roadside: low buildings/walls + trees as simple forms (context, fading into fog)
for (let z = 6; z < 150; z += 7 + (z % 3)) {
  for (const side of [-1, 1]) {
    const hgt = 1.6 + ((z * 7) % 3) * 0.7;
    const x = side * (15.5 + ((z * 3) % 4));
    mesh(rbox(5, hgt, 5.5, 0.1), M(0xeceef1), x, hgt / 2, z);
  }
}
for (let z = 10; z < 140; z += 9) for (const side of [-1, 1]) {
  const x = side * (11.5 + ((z * 5) % 2));
  mesh(new THREE.CylinderGeometry(0.09, 0.12, 1.8, 8), bodyDark, x, 0.9, z + side * 2);
  mesh(new THREE.IcosahedronGeometry(1.0, 1), M(0xdfe5dd, { flatShading: true }), x, 2.4, z + side * 2);
}

// ---------------------------------------------------------------- camera
let cam;
if (VIEW === "iso") {
  cam = new THREE.PerspectiveCamera(32, W / H, 0.5, 400);
  cam.position.set(-30, 40, -20);
  cam.lookAt(0.5, 0, 19);
} else {
  cam = new THREE.PerspectiveCamera(34, W / H, 0.5, 400);
  cam.position.set(1.2, 10.5, -15.5);
  cam.lookAt(0.6, 0, 19);
}
renderer.render(scene, cam);
// label anchors for the slide callouts, in image fractions (x already mirrored like the canvas)
const anchors = {
  ego: [EGO_X, 1.2, 0.5], corridor: [EGO_X + 1.6, 0, 22], pedestrian: [1.2, 1.9, 36], cutin: [1.4, 1.6, 14],
  workzone: [EGO_X - 0.2, 1.0, 26], oncoming: [3.4, 3.4, 30], cattle: [8.0, 1.8, 37], wrongway: [-4.3, 1.8, 40],
  auto: [-0.6, 1.9, 40], footpath: [-7.4, 1.8, 16.6], bus: [-2.4, 3.2, 72],
};
window.__anchors = Object.fromEntries(Object.entries(anchors).map(([k, [x, y, z]]) => {
  const v = new THREE.Vector3(x, y, z).project(cam);
  return [k, [+(1 - (v.x + 1) / 2).toFixed(4), +((1 - v.y) / 2).toFixed(4)]];
}));
window.__ready = true;
</script></body></html>
